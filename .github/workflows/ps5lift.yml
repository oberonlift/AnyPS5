name: ps5lift

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ps5lift/**
      - core/**
      - 3rdparty/**
      - cmake/**
      - CMakeLists.txt
      - .gitmodules
      - .github/workflows/ps5lift.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps5lift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ccache python3 clang-18 lld-18 llvm-18-dev libzstd-dev zlib1g-dev python3-clang-18 g++-x86-64-linux-gnu libx11-dev libxext-dev libxrandr-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev libpipewire-0.3-dev libpulse-dev libasound2-dev
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ps5lift-ccache-${{ github.sha }}
          restore-keys: ps5lift-ccache-
      - name: Configure
        run: cmake -S ps5lift -B ps5lift/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/lib/llvm-18/bin/clang -DCMAKE_CXX_COMPILER=/usr/lib/llvm-18/bin/clang++ -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
      - name: Build ps5lift and AnyPS5's libraries for a lifted guest
        run: cmake --build ps5lift/build --parallel 4
      - name: Test
        run: ctest --test-dir ps5lift/build --output-on-failure --parallel 4
      - if: always()
        run: ccache --show-stats
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ps5lift-ccache-${{ github.sha }}
